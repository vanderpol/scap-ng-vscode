name: Editor source qualification (no artifacts)
on:
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'scripts/audit-graphical-schema.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/editor-source-qualification.yml'
  workflow_dispatch:
jobs:
  source-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Bootstrap exact public schema inputs and metadata pack
        run: python scripts/bootstrap_dependencies.py
      - name: Install reviewed public converter dependencies
        run: python -m pip install -e .external/scap-ng-tools
      - name: Generate and verify the exact pinned metadata pack
        run: python scripts/bootstrap_dependencies.py --with-pack
      - name: Verify the same resources without network access
        run: python scripts/bootstrap_dependencies.py --offline --with-pack
      - name: Install exact lockfile dependencies
        run: npm ci --ignore-scripts
      - name: TypeScript typecheck
        run: npm run lint
      - name: Unit and source regression tests
        run: npm test
